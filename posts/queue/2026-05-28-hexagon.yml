  - text: |-
      показываю проект который собрал для своей команды, называется Шестигранник.
      хочу собрать обратку

      это система которая оценивает видео креативы и сценарии для рекламы по 6
      параметрам от 0 до 10. на выходе шестигранник где сразу видно где креатив
      проседает
  - text: |-
      параметры такие: хук в первые 3 секунды, утп, cta, попадание в цу,
      визуальный ритм, эмоциональный триггер

      загружаешь ролик или сценарий, система прогоняет, выдаёт оценки и текстовые
      комменты по каждому пункту. где докрутить, что переделать
  - text: |-
      сделал чтобы не запускать слабые ролики в прод, экономит бюджет и нервы
      команды

      ребят кто работает с креативами и таргетом, как вам сам подход? каких
      параметров не хватает на ваш взгляд? может что-то лишнее
