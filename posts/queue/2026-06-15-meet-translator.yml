thread:
  - text: |-
      у нас есть переводчик на созвоны с китайскими партнёрами. и каждый раз
      когда он заболевал или просто не на связи - созвон отменяй. вся
      коммуникация висела на одном человеке
  - text: |-
      надоело зависеть. собрал штуку которая переводит прямо в звонке.
      партнёр говорит по-китайски - мне в наушники сразу русский. я отвечаю
      по-русски - он слышит китайский. справа весь диалог текстом, обе
      стороны

      у гугл мита рус-кит вообще нет, только европейские
  - text: |-
      показал нашему партнёру а джону - он в диком восторге, сидит ржёт,
      повторяет 厉害了 (круто мол)

      идём к тому что можем понимать друг друга вообще без языкового барьера
      и без посредника. думал это где-то в будущем, а собралось за вечер
